<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>尾崎ガス配管</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <meta name="theme-color" content="#1e293b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GAS">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    html, body { margin: 0; height: 100%; background: #1e293b; }
    iframe {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: 0; background: #f4f6f9;
      /* ノッチ・ホームバー分の余白 */
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <!-- ★ここをあなたのStreamlitアプリのURLに書き換える★ -->
  <iframe
    src="https://gas-app-system.streamlit.app/?embed=true"
    allow="clipboard-write; fullscreen"
    title="尾崎ガス配管 社内ポータル"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
